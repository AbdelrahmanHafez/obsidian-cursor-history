name: Release

on:
  push:
    tags:
      - '*'

permissions:
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
