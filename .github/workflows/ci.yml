name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: ./node_modules/.bin/tsc --noEmit
