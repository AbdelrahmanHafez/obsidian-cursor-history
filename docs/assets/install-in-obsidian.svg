<svg xmlns="http://www.w3.org/2000/svg" width="286" height="52" viewBox="0 0 286 52" role="img" aria-labelledby="title desc">
  <title id="title">View and install in Obsidian</title>
  <desc id="desc">Open the official Obsidian Community plugin page</desc>
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4c1d95" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="280" height="44" rx="12" fill="url(#button)" filter="url(#shadow)"/>
  <text x="143" y="31.5" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650" text-anchor="middle">View &amp; install in Obsidian</text>
</svg>
